version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autoservicepal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoservicepal
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: autoservicepal_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoservicepal -d autoservicepal_db']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:15-alpine
    container_name: autoservicepal_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoservicepal
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: autoservicepal_test
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoservicepal -d autoservicepal_test']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoservicepal_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
